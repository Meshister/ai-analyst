schema_version: 1
purpose: 'Every KPI named in the reference docs, with its planned metric ID, owning agent and phase. status: built = defined
  in this registry (planned_id is the registry file); backlog = not yet defined. Each phase starts by promoting its backlog
  entries into registry files, deduplicating planned IDs, and dropping entries that are not metrics (qualitative feedback,
  analyses).'
excluded:
- 'game-analytics-doc: A/B testing, statistical-model, ML-model and case-study sections (methods, not metrics)'
- 'cheat-sheet: interview-prep half and development-milestone checklists (activities, not metrics)'
- '2k-doc: interview prep, resume stories and past-employer results (not for a public repo)'
- 'infinity-nikki: a game teardown; its currency list seeds the game-teardown skill, not metrics'
