schema_version: 1

name: dlc_attach_rate
display_name: "DLC attach rate"
aliases: [attach rate, add-on attach]
definition: >-
  Share of a title's base-game owners on a platform who also own a given DLC or
  expansion, to date. Owners who got the DLC inside an edition are counted and
  reported as a separate split.
grain: dlc_platform_period
status: draft
owner: games-premium-sales
min_value: 0
max_value: 1
caveats:
  - "Always report standalone purchases and edition-included DLC separately; a deluxe-edition-heavy launch inflates attach without anyone choosing the DLC."
  - "Base-game owners and DLC owners must come from the same platform and date; cross-platform owners are not deduplicated in platform statements."
  - "Attach keeps rising over the title's life. Compare DLCs at the same age since the DLC's own release."

formula: "attach = (standalone_dlc_units + edition_included_dlc_units) / base_game_units_to_date (same platform, same as_of date)"
day_boundary:
  supported: [reporting_tz, utc]
  default: reporting_tz
maturity_rule: "null until the platform statements covering the as_of date have posted; provisional until the refund window has closed."
retention_type: not_applicable
revenue_scope: not_applicable
payer_window: not_applicable
identity_basis: not_applicable
tags:
  family: customer
  scope: generic
  horizon: [strategic, tactical]
  business_model: [premium_one_off, premium_live]
  platform: [console, pc, mobile]
distinct_from: [units_sold, payer_conversion_cohort_day_n]
sources:
  - ref: games-analyst-plan
    note: "Premium Sales Analyst: dlc-attach. Draft: no reference doc covers premium catalog metrics."
