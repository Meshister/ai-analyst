schema_version: 1

name: net_revenue_title
display_name: "Net revenue per title"
aliases: [net sales, net receipts]
definition: >-
  Revenue a title earns in a period after platform fees, refunds and sales tax,
  in the reporting currency, across base game and paid add-ons.
grain: title_platform_day
status: draft
owner: games-premium-sales
caveats:
  - "Gross vs net: consumer price, price after tax, and receipts after the platform fee are three different numbers. This metric is receipts after all three."
  - "Currency: state the conversion rate and date. Statement currency, local price currency and reporting currency often differ."
  - "Bundle revenue is allocated to the titles and add-ons inside it; state the allocation rule. Platform fees can be tiered by lifetime revenue, so the fee rate can change mid-life."

formula: "net_revenue_t = gross_sales_t - sales_tax_t - refunds_t - platform_fees_t"
parameters:
  revenue_scope: {type: revenue_scope, default: {streams: [base_game, dlc, season_pass], basis: net_all}}
day_boundary:
  supported: [reporting_tz, utc]
  default: reporting_tz
maturity_rule: >-
  null until the platform statement for the period has posted; provisional until
  the refund window has closed and the statement is final (statements can be restated).
retention_type: not_applicable
revenue_scope:
  streams: [base_game, dlc, season_pass]
  basis: net_all
payer_window: not_applicable
identity_basis: not_applicable
tags:
  family: customer
  scope: generic
  horizon: [strategic, tactical, operational]
  business_model: [premium_one_off, premium_live]
  platform: [console, pc, mobile]
distinct_from: [units_sold, average_selling_price]
sources:
  - ref: games-analyst-plan
    note: "Premium one-off core metrics: net revenue; traps: gross vs net and VAT. Draft: no reference doc covers premium catalog metrics."
