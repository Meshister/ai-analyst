schema_version: 1

name: platform_mix_share
display_name: "Platform mix (revenue share)"
aliases: [platform split, storefront mix]
definition: >-
  Share of a title's net revenue in a period that comes from each platform or
  storefront.
grain: title_platform_period
status: draft
owner: games-premium-sales
min_value: 0
max_value: 1
caveats:
  - "Revenue shares and unit shares differ when prices or fees differ by platform; this is revenue, and the unit version is a separate metric."
  - "Cross-buy and cross-gen upgrades attach one purchase to two platforms; allocate by the platform of sale, and say so."
  - "Subscription-service payouts are revenue but not sales; include or exclude them explicitly."

formula: "mix_p,t = net_revenue_title_p,t / sum over platforms of net_revenue_title_t"
parameters:
  revenue_scope: {type: revenue_scope, default: {streams: [base_game, dlc, season_pass], basis: net_all}}
day_boundary:
  supported: [reporting_tz, utc]
  default: reporting_tz
maturity_rule: "null until every platform's statement for the period has posted; a missing platform makes the others' shares wrong."
retention_type: not_applicable
revenue_scope:
  streams: [base_game, dlc, season_pass]
  basis: net_all
payer_window: not_applicable
identity_basis: not_applicable
tags:
  family: customer
  scope: generic
  horizon: [strategic, tactical]
  business_model: [premium_one_off, premium_live]
  platform: [console, pc, mobile]
distinct_from: [platform_mix_units_share, net_revenue_title]
sources:
  - ref: games-analyst-plan
    note: "Premium Sales Analyst: platform-mix (storefront split, cross-buy and upgrade SKUs). Draft."
