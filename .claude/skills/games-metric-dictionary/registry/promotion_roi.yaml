schema_version: 1

name: promotion_roi
display_name: "Promotion ROI"
aliases: [promo ROI, sale ROI]
definition: >-
  Incremental net revenue a promotion produced over its sale and post-sale
  windows, less the promotion's direct costs, divided by those costs.
grain: title_region_promotion
status: draft
owner: games-portfolio-performance
caveats:
  - "Incremental revenue is already net of the discount; do not also count the discount as a cost."
  - "Undefined when direct costs are zero (a platform-run sale with no fee or spend); report incremental net revenue instead."
  - "Uses the same baseline and windows as discount_lift_net, and inherits its storefront-event and post-sale-dip rules."

formula: >-
  incremental_net_revenue = (net_revenue_sale + net_revenue_post) - baseline_daily_net_revenue * (sale_days + post_window_days);
  roi = (incremental_net_revenue - direct_costs) / direct_costs
parameters:
  pre_window_days: {type: int, min: 7, default: 28}
  post_window_days: {type: int, min: 1, default: 14}
day_boundary:
  supported: [reporting_tz, utc]
  default: reporting_tz
maturity_rule: "null until post_window_days after the promotion have elapsed and statements have posted; provisional until the refund window closes."
retention_type: not_applicable
revenue_scope:
  streams: [base_game, dlc, season_pass]
  basis: net_all
payer_window: not_applicable
identity_basis: not_applicable
tags:
  family: customer
  scope: generic
  horizon: [tactical]
  business_model: [premium_one_off, premium_live]
  platform: [console, pc, mobile]
distinct_from: [discount_lift_net, post_sale_dip]
sources:
  - ref: games-analyst-plan
    note: "Portfolio Performance: commercial-scorecard (promotion ROI). Draft."
