schema_version: 1

name: refund_rate
display_name: "Refund rate"
aliases: [return rate]
definition: >-
  Share of base-game units sold in a period that were later refunded, with
  refunds attributed to the original sale date.
grain: title_platform_period
status: draft
owner: games-premium-sales
min_value: 0
max_value: 1
caveats:
  - "Refund policies differ by storefront (e.g. playtime and days-since-purchase limits); compare platforms only with that in mind."
  - "Launch-week refunds are often technical (performance, crashes); split them by the refund reason where the platform provides it."
  - "Attributed to sale date, so recent periods keep rising until the refund window closes."

formula: "refund_rate_t = units_refunded(sold in t) / units_sold_gross(sold in t)"
day_boundary:
  supported: [reporting_tz, utc]
  default: reporting_tz
maturity_rule: "Provisional until the refund window for the last sale day in the period has closed; label as provisional until then."
retention_type: not_applicable
revenue_scope: not_applicable
payer_window: not_applicable
identity_basis: not_applicable
tags:
  family: customer
  scope: generic
  horizon: [tactical, operational]
  business_model: [premium_one_off, premium_live]
  platform: [console, pc, mobile]
distinct_from: [units_sold]
sources:
  - ref: games-analyst-plan
    note: "Premium one-off core metrics: refund rate; PC traps: launch-week refunds. Draft."
