schema_version: 1

name: retention_dn_rolling
display_name: "Day-N retention (rolling)"
aliases: [unbounded retention, return-after-day-n rate]
definition: >-
  Share of a first-session cohort that plays on day n or on any later day
  observed so far (day 0 = first session day).
grain: cohort_day
status: active
owner: games-engagement-growth
min_value: 0
max_value: 1
caveats:
  - "Never final: the value rises as more days are observed. Report it with its as_of date and compare cohorts only at the same age."
  - "Always >= strict R_n and never rises with n. Shown next to strict Dn it overstates engagement, so label the type in every output."
  - "Reinstalls and new accounts on a known player enter as new cohort members unless identity is deduplicated; this inflates cohort size and depresses R_n."

formula: "R_n_rolling = players_active_on_or_after_day_n / cohort_size"
parameters:
  n: {type: int, min: 1}
day_boundary:
  supported: [utc, player_local, reporting_tz]
  default: utc
maturity_rule: >-
  null (never 0) until day n has fully elapsed for every cohort member (same rule
  as retention_dn_strict). After that the value is provisional and grows with each
  observed day; label it with its as_of date.
retention_type: rolling
revenue_scope: not_applicable
payer_window: not_applicable
identity_basis:
  cohort_event: first_session
  player_key: account_id
tags:
  family: customer
  scope: generic
  horizon: [strategic, tactical]
  business_model: [f2p_live, premium_live, premium_one_off, daily_subscription]
  platform: [console, pc, mobile]
distinct_from: [retention_dn_strict, retention_dn_bracket]
sources:
  - ref: games-analyst-handoff
    note: "Retention types enumerated as strict / rolling / bracket; each a separate ID"
